name: Refresh data

on:
  schedule:
    - cron: '17 21 * * 1-5' # weekdays, after ECB reference-rate publication (~16:00 CET)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run data
      - name: Commit changed snapshots
        run: |
          git config user.name "coin-atlas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "data: refresh snapshots $(date -u +%Y-%m-%d)"
          git push
